# config.yaml

# Paths to the Lich and Profanity binaries
paths:
  lich_bin: '/your/path/to/Lich5/lich5/lich.rbw'
  profanity_bin: '/your/path/to/ProfanityFE/profanity.rb'

# Character accounts and their characters
accounts:
  account1:
    - char1
    - char2
    - char3
    - char4
    - char5
  account2:
    - char1
    - char2
    - char3
    - char4
    - char5
  account3:
    - char1
    - char2
    - char3
    - char4
    - char5

# Optional: which server the launcher starts on — 'prime' (default) or 'test'.
# Press 't' in the launcher to toggle between them at any time.
# default_realm: prime

# Optional: Lich flags used to select each server. The defaults are shown; you
# only need this if Lich's game-selection flags change. Note that '--test' must
# be paired with '--gemstone': on its own, Lich fails instance resolution and
# refuses the login.
# realms:
#   prime: []                        # uses the saved entry's own instance (GS3)
#   test: ["--gemstone", "--test"]   # GST

# Optional: bundled ProfanityFE template used for characters that have no
# ~/.profanity/<char>.xml (per-char files always win). default.xml is a
# DragonRealms layout; GemStone options: original.xml, tysong.xml, eleazzar.xml
# profanity_template: original.xml
